[package]
name = "niri-shelf"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "niri-shelf-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "niri-shelf-ctl"
path = "src/bin/ctl.rs"

[dependencies]
niri-ipc = "25.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
